<ion-content>
  <div class="center-container">
    <div class="ion-padding-vertical">
      <ion-card class="ion-text-center card-background">
        <!-- Verifica si el usuario está definido y muestra la contraseña -->
        <ion-card-content *ngIf="usuario">
          <p>Tu contraseña es: {{ usuario.password }}</p>
        </ion-card-content>
        <ion-button (click)="navegarALogin()">Volver al Ingreso</ion-button>
      </ion-card>
    </div>
  </div>
</ion-content>
